<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="login.js/lofin.js" defer></script>
</head>
<body>
    <div class="container">
        
        <div class="card shadow p-4 login-wrapper">
            <div class="profile d-flex align-items-center justify-content-center"><i class="bi bi-person-circle icon-tag"></i></div>
             <h5 class="text-center fw-bold mb-1">Academic Tracker Login</h5>
            <p class="text-center text-muted mb-4">Sign in to continue</p>

            <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="email" class="form-control" id="username" name="username" placeholder="name@gmail.com" autocomplete="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-maroon w-100">Log In</button>
            <p class="text-center text-muted login-helper-text mt-3">
                Demo sign-in only. Account credentials are not verified by a server.
            </p>
            <p id="loginMessage" class="login-message" role="status" aria-live="polite" hidden></p>
            </form>
        </div>
    </div>
</body>
</html>
